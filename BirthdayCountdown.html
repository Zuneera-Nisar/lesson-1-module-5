<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Countdown Checker</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ffd1dc, #dff6ff);
            text-align: center;
        }

        .box {
            width: 500px;
            margin: 80px auto;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 5px 15px #999;
        }

        h1 {
            color: #ff4081;
        }

        .emoji {
            font-size: 55px;
        }

        label {
            display: block;
            margin: 20px;
            font-size: 18px;
            font-weight: bold;
        }

        input {
            padding: 10px;
            border: 2px solid #ff4081;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            margin-top: 15px;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            background: #ff4081;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #e91e63;
        }

        #answer {
            margin-top: 25px;
            padding: 20px;
            background: #fff0f5;
            border-radius: 12px;
            font-size: 18px;
        }

        #list {
            margin-top: 20px;
            line-height: 1.8;
        }
    </style>
</head>

<body>
    <div class="box">

        <div class="emoji">🎂 🎈 🎁</div>
        <h1>Birthday Countdown Checker</h1>
        <p>Find out how many days are left until your birthday!</p> 
        <label>
             Select your birthday:
              <input type="date" id="birthDate">
         </label>
          <button id="countdownButton">Start Countdown</button>

        <div id="answer">
             Your result will appear here.
             </div>
        <div id="list"></div>
    </div>


    <script> document.getElementById("countdownButton").addEventListener("click", countdown);
     
    function countdown() { let dateValue = document.getElementById("birthDate").value;
     if (dateValue === "") { 

        document.getElementById("answer").innerHTML = 
        "⚠️ Please select your birthday first!"; 

        document.getElementById("list").innerHTML = ""; 
        return;
     } 

    let today = new Date();

    let birthday = new Date(dateValue +"T00:00:00");

    birthday.setFullYear(today.getFullYear());

    let todayOnly = new Date(
    today.getFullYear(),
    today.getMonth(),
    today.getDate()
);

    if (birthday < todayOnly) {
    birthday.setFullYear(today.getFullYear() + 1); 
} 

    let timeDifference = birthday - todayOnly; 

    let days = Math.round(
    timeDifference / (1000 * 60 * 60 * 24)
); 

    let message; 
    if (days === 0) {
    message = "🎉 It's your birthday today!"; 

} else if (days <= 10) { 
     message = "🥳 Your birthday is coming very soon!";

} else if (days <= 30) {
    message = "🎈 Your birthday is less than a month away!"; 

} else { 
    message = "😊 There is still plenty of time!"; 
} 

    document.getElementById("answer").innerHTML =
    message + 
    "<br><br>" + 
    "📅 Days remaining: <strong>" + 
    days + 
"</strong>"; 

    let review = "<h3>🎁 Countdown Review</h3>"; 
                             
    for (let i = 1; i <= 5; i++) { 
    let remaining = days - i; 
    if (remaining > 0) {
     review += 
    "Day " + i + ": " + 
    remaining + 
        " days remaining 🎈<br>";

    } else {
     review += 
    "Day " + i + 
    ": Birthday celebration time! 🎉<br>"; 
} 
    }
    document.getElementById("list").innerHTML = review; 
 } 

 </script>

</body>

</html>
