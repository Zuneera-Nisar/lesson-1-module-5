<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>My Game Profile</title>
        <style>
            body{
                background-color: beige;
                font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
                text-align: center;
                padding: 30px;
            }
            h1{
                color: lightcoral;
            }
            button{
                background-color: whitesmoke;
                color: lightcoral;
                padding: 10px 20px;
                border-radius: 20px;
            }
            div{
                border: 1px solid lightcoral;
                width: 280px;
                margin: 6px auto;
                padding: 8px 12px;
                text-align: left;
                border-radius: 6px;
            }
        </style>
    </head>
    <body>
        <h2>My Game Profile</h2>
        <button onclick="showprofile()">Show Profile</button>
        <div>
            name; <span id="name"></span>
        </div>
        <div>
            score; <span id="score"></span>
        </div>
        <div>
            top score; <span id="topscore"></span>
        </div>
        <div>
            rank; <span id="rank"></span>
        </div>
        <div>
            greetings; <span id="greetings"></span>
        </div>
        <div>
            stars; <span id="stars"></span>
        </div>
        <div>
            bonus level; <span id="bonus"></span>
        </div>
        <div>
            team name; <span id="team"></span>
        </div>
        <script>
            function showprofile(){
                let name="Zuneera Nisar";
                let myscore=75;
                let highscore=100;
                let bonus="null";
                let team;
                let istopscore=myscore==highscore;
                let rank;
                if(myscore>=80){
                    rank="gold";
                }else if(myscore>=50){
                    rank="silver";
                }
                else{
                    rank="bronze";
                }
                let hour=new Date().getHours();
                let greetings;
                if(hour<12){
                    greetings="Good Morning";
                }
                else if(hour<17){
                    greetings="Good Afternon";
                }
                else{
                    greetings="Good Evning";
                }
                let stars="";
                let count=0;
                while(count<5){
                    stars=stars+"✨";
                    count=count+1;
                }
                document.getElementById("name").innerHTML=name;
                document.getElementById("score").innerHTML = myscore+" out of "+highscore;
                document.getElementById("topscore").innerHTML = istopscore;
                document.getElementById("rank").innerHTML = rank;
                document.getElementById("greetings").innerHTML = greetings;
                document.getElementById("stars").innerHTML = stars;
                document.getElementById("bonus").innerHTML = bonus;
                document.getElementById("team").innerHTML = team;
            }
        </script>
    </body>
</html>
